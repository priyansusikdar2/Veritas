# Render Blueprint Specification for Veritas
# Learn more at https://render.com/docs/blueprint-spec

services:
  # Unified Full-Stack Service (Backend + Compiled Frontend)
  - type: web
    name: veritas-platform
    runtime: python
    plan: free
    region: oregon
    buildCommand: "cd frontend && npm install && npm run build && cd .. && pip install -r backend/requirements.txt"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: NODE_VERSION
        value: 20.11.0
      # Optional API Keys (Leave empty for autonomous local engine)
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
